title: 'La Vorágine'
tagline: 'Un laboratorio de edición digital'
email: info@librosdelavoragine.com
description: >- # this means to ignore newlines until "baseurl:"
  Libros de la vorágine es una micro editorial independiente, con un pie en Barcelona y otro en Santiago de Chile, nacida en 2011, cuyo catálogo suma ya más de veinte títulos.
  
  Ofrecemos un catálogo heterogéneo, editado principalmente en castellano (aunque hayamos publicado también algunos títulos en catalán), hecho de clásicos olvidados, ensayos urgentes, y ficción reveladora. Publicamos libros no editados anteriormente en castellano, en traducciones cuidadas, y con énfasis particular en la accesibilidad.

  A pesar de la pluralidad de géneros y temáticas, nuestras publicaciones tienen un común denominador: la voluntad de despertar el asombro en el lector y promover la edición libre desde los márgenes de la cultura.
url: "https://librosdelavoragine.com"
baseurl: ""

twitter_username: voraginebooks
github_username: nastarovia

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
   - .sass-cache/
   - .jekyll-cache/
   - gemfiles/
   - Gemfile
   - Gemfile.lock
   - node_modules/
   - vendor/bundle/
   - vendor/cache/
   - vendor/gems/
   - vendor/ruby/

collections:
  libros:
    output: true
    permalink: /libros/:path/
  novedades:
    output: true
    permalink: /novedades/:path/

#social media

facebook_url: 'https://www.facebook.com/LibrosdelaVoragine/'
twitter_url: 'https://twitter.com/voraginebooks'
linkedin_url:
pinterest_url:
instagram_url:
bluesky_url: 'https://bsky.app/profile/voraginebooks.bsky.social'

# Perfiles oficiales para los datos estructurados (schema.org «sameAs»): solo URL que existan
sameas:
  - 'https://www.facebook.com/LibrosdelaVoragine/'
  - 'https://twitter.com/voraginebooks'
  - 'https://bsky.app/profile/voraginebooks.bsky.social'
