<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
        <meta name="google-site-verification" content="pQEjeS6rtQ7nlD1cMqIiarv3cg_qJWl44pSVd6MaTSY" />
  <title>{%- if page.title -%}
           {{ page.title | escape }}
         {%- else -%}
           {{ site.title | escape }}
         {%- endif -%}</title>
  <meta name="description"
      content="{% if page.description %}
                 {{ page.description | strip_html | strip_newlines | escape }}
               {% elsif page.excerpt %}
                 {{ page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}
               {% else %}
                 {{ site.description | strip_newlines | escape }}
               {% endif %}">


    <link rel="stylesheet"
        href="{{ '/assets/css/main.css' | prepend: site.baseurl }}">
  <link rel="canonical"
        href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="alternate"
        type="application/rss+xml"
        title="{{ site.title }}"
        href="{{ '/feed.xml' | prepend: site.baseurl | prepend: site.url }}">

  <link rel="shortcut icon" type="image/png" sizes="16x16" href="/assets/imgs/favicon.ico">

  <script src="{{ '/assets/js/dropdown.js' | prepend: site.baseurl | prepend: site.url }}"></script>

  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": "{{ site.url }}/#editorial",
  "name": "Libros de la Vorágine",
  "url": "{{ site.url }}",
  "logo": "{{ site.url }}/assets/imgs/logo_ldlvoragine_ok.png",
  "foundingDate": "2011",
  "email": "{{ site.email }}",
  "description": {{ site.description | strip_newlines | jsonify }},
  "location": [
    {"@type": "Place", "name": "Barcelona, España"},
    {"@type": "Place", "name": "Santiago de Chile, Chile"}
  ],
  "sameAs": [
    {%- assign primero = true -%}
    {%- for u in site.sameas -%}{%- unless primero %},{% endunless %}
    "{{ u }}"{%- assign primero = false -%}{%- endfor %}
  ]
}
</script>

{% if page.layout == "book-page" %}
  {% assign books = site.data.books | where: "book", page.title %}
  {% assign item = books[0] %}
  {% if item %}
  {% capture hoy %}{{ site.time | date: "%Y-%m-%d" }}{% endcapture %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Book",
  "@id": "{{ page.url | prepend: site.url }}#libro",
  "name": {{ item.book | jsonify }},
  {% if item.book_subtitle %}"alternativeHeadline": {{ item.book_subtitle | jsonify }},{% endif %}
  "author": {"@type": "Person", "name": {{ item.author | jsonify }}},
  {% if item.translator_names.size > 0 %}"translator": [{% for t in item.translator_names %}{"@type": "Person", "name": {{ t | jsonify }}}{% unless forloop.last %}, {% endunless %}{% endfor %}],{% endif %}
  {% if item.prologue and item.prologue != "" %}"contributor": {{ item.prologue | jsonify }},{% endif %}
  {% if item.illustrator and item.illustrator != "" %}"creditText": {{ item.illustrator | prepend: "En cubierta: " | jsonify }},{% endif %}
  "inLanguage": "{{ item.lang | default: 'es' }}",
  {% if item.original_title %}"translationOfWork": {"@type": "Book", "name": {{ item.original_title | jsonify }}{% if item.original_lang %}, "inLanguage": "{{ item.original_lang }}"{% endif %}{% if item.original_year %}, "datePublished": "{{ item.original_year }}"{% endif %}},{% endif %}
  "isbn": "{{ item.isbn | strip }}",
  "bookFormat": "https://schema.org/Paperback",
  {% assign np = item.pages_number | strip | plus: 0 %}{% if np > 0 %}"numberOfPages": {{ np }},{% endif %}
  "publisher": {"@id": "{{ site.url }}/#editorial", "@type": "Organization", "name": "Libros de la Vorágine"},
  {% if item.release_iso %}"datePublished": "{{ item.release_iso }}",{% endif %}
  "description": {{ item.description | markdownify | strip_html | normalize_whitespace | strip | jsonify }},
  "image": "{{ site.url }}{{ item.cover }}",
  "url": "{{ page.url | prepend: site.url }}",
  {% if item.reviews %}"review": [{% for r in item.reviews %}{
    "@type": "Review",
    "author": {"@type": "Person", "name": {{ r.author | jsonify }}},
    {% if r.source %}{% assign s = r.source | downcase %}{% unless s contains "prólogo" or s contains "introducción" or s contains "texto" %}"publisher": {"@type": "Organization", "name": {{ r.source | jsonify }}},{% endunless %}{% endif %}
    "reviewBody": {{ r.text | jsonify }}
  }{% unless forloop.last %},{% endunless %}{% endfor %}],{% endif %}
  {% assign precio = item.price_print | default: item.PVP | default: item.PVP_euros | replace:'€','' | replace:',','.' | strip %}
  "offers": {
    "@type": "Offer",
    {% if precio != "" %}"price": "{{ precio }}",{% endif %}
    "priceCurrency": "{{ item.price_currency | default: 'EUR' }}",
    {% if item.release_iso and item.release_iso > hoy %}"availability": "https://schema.org/PreOrder",
    "availabilityStarts": "{{ item.release_iso }}",{% else %}"availability": "https://schema.org/InStock",{% endif %}
    "url": "{{ page.url | prepend: site.url }}"
  }
}
</script>
  {% endif %}
{% endif %}

</head>
